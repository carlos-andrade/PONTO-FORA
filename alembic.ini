# PONTO-FORA — configuração Alembic
# Identificador: PF-CFG-ALEMBIC-001
# Versão: 1.0
# Data de criação: 03/11/2026
# Data da última atualização: 03/11/2026
# Estado: Em desenvolvimento controlado
# Responsável: Engenharia de Software
# Âmbito: Configuração das migrações da base de dados.
# SHA-256 (conteúdo normalizado): f4da5c02c8aa04c5c98a6068e36edca071a8259824b6a62ff7bb299801601d98
# Commit de referência (base documental): eba38c76bd8fe4fbddf6fbef8a9419ebdd9319d4

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./ponto_fora.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers = console
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
