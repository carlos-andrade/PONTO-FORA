# Commit de referência (base documental): ab40c30648ce632f24df6f7b767e7d026d23fffc

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponto-fora"
version = "0.1.0"
description = "Plataforma editorial PONTO-FORA"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
