# PONTO-FORA — integração contínua
# Identificador: PF-CI-PYTHON-001
# Versão: 1.1
# Data de criação: 03/11/2026
# Data da última atualização: 03/11/2026
# Estado: Em desenvolvimento controlado
# Responsável: Engenharia de Software
# Âmbito: Lint, migrações PostgreSQL e testes automatizados do backend.
# SHA-256 (conteúdo normalizado): PENDING
# Commit de referência (base documental): eba38c76bd8fe4fbddf6fbef8a9419ebdd9319d4

name: CI

on:
  push:
    branches: ["main", "phase-a/**", "phase-b/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, migrações e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponto_fora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ponto_fora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ponto_fora_test
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar projeto e dependências de desenvolvimento
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Verificar estilo e erros estáticos
        run: ruff check .
      - name: Aplicar migrações PostgreSQL
        run: alembic upgrade head
      - name: Confirmar revisão aplicada
        run: alembic current
      - name: Executar testes
        run: pytest
