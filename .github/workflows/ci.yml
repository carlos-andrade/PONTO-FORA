# Commit de referência (base documental): ab40c30648ce632f24df6f7b767e7d026d23fffc

name: CI

on:
  push:
    branches: ["main", "phase-a/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar projeto e dependências de desenvolvimento
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Verificar estilo e erros estáticos
        run: ruff check .
      - name: Executar testes
        run: pytest
